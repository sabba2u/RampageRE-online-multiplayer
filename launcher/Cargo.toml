[package]
name = "rampage-launcher"
version = "0.1.0"
edition = "2021"
description = "RampageRE's launcher: play, host (Steam or a built-in lobby), join by code or link, rampage:// links"
license = "MIT"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
